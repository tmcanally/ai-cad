[project]
name = "aicad"
version = "0.1.0"
description = "AI-driven CAD: build123d designs, an MCP server for Claude, and a browser viewer for assemblies"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "build123d>=0.9",
    "mcp>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
aicad = "aicad.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
