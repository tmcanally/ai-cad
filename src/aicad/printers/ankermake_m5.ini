# AnkerMake M5 (0.4 mm nozzle) for PrusaSlicer's command line.
#
# Values follow AnkerMake's own PrusaSlicer profile ("AnkerMake M5 (0.4 mm
# nozzle)" with "0.20 mm NORMAL"), flattened into one file so slicing doesn't
# depend on which vendor bundles a slicer has installed. Deliberate
# changes: the bed shape is written correctly (the vendor file has a typo in
# it), the skirt is one loop 2 mm out so parts can sit closer to the bed
# edge, and thumbnails are off because PrusaSlicer can't render them without a
# display. Filament temperatures and per-part settings (infill, walls,
# supports, brim) are added by aicad.printing.

# ---- printer ----
printer_technology = FFF
printer_model = M5
printer_settings_id = AnkerMake M5 (0.4 mm nozzle)
printer_notes = MACHINE_M5_\nPRINTER_VENDOR_ANKERMAKE\nPRINTER_MODEL_M5\n
bed_shape = 0x0,235x0,235x235,0x235
max_print_height = 250
gcode_flavor = marlin2
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.32
use_relative_e_distances = 1
use_firmware_retraction = 0
retract_length = 3
retract_speed = 60
deretract_speed = 60
retract_before_travel = 3
retract_layer_change = 1
retract_lift = 0
wipe = 0
machine_limits_usage = time_estimate_only
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 50
machine_max_feedrate_e = 100
machine_max_acceleration_x = 10000
machine_max_acceleration_y = 10000
machine_max_acceleration_z = 10000
machine_max_acceleration_e = 10000
machine_max_acceleration_extruding = 10000
machine_max_acceleration_retracting = 10000
machine_max_acceleration_travel = 10000
machine_max_jerk_x = 15
machine_max_jerk_y = 15
machine_max_jerk_z = 0.3
machine_max_jerk_e = 3
thumbnails =
remaining_times = 1
autoemit_temperature_commands = 1
start_gcode = M104 S{first_layer_temperature[0]} ; set final nozzle temp\nM190 S{first_layer_bed_temperature[0]} ; set and wait for bed temp to stabilize\nM109 S{first_layer_temperature[0]} ; wait for nozzle temp to stabilize\nG28 ;Home\n;LAYER_COUNT:{total_layer_count}\n
end_gcode = M104 S0\nM140 S0\n;Retract the filament\nG92 E1\nG1 E-1 F300\nG28 X0 Y0\nM84
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;{layer_z}\n;LAYER:{layer_num+1}
layer_gcode = ;AFTER_LAYER_CHANGE\nG92 E0
color_change_gcode = M600
pause_print_gcode = M601

# ---- print (0.20 mm NORMAL) ----
layer_height = 0.2
first_layer_height = 0.14
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = grid
top_fill_pattern = rectilinear
bottom_fill_pattern = rectilinear
extrusion_width = 0.4
external_perimeter_extrusion_width = 0.44
first_layer_extrusion_width = 0.4
perimeter_extrusion_width = 0.4
infill_extrusion_width = 0.4
solid_infill_extrusion_width = 0.4
top_infill_extrusion_width = 0.4
elefant_foot_compensation = 0.2
seam_position = aligned
perimeter_speed = 250
external_perimeter_speed = 150
small_perimeter_speed = 150
infill_speed = 250
solid_infill_speed = 250
top_solid_infill_speed = 150
gap_fill_speed = 150
bridge_speed = 50
travel_speed = 250
first_layer_speed = 50%
support_material_speed = 150
max_print_speed = 250
default_acceleration = 2500
perimeter_acceleration = 2500
infill_acceleration = 2500
bridge_acceleration = 2500
first_layer_acceleration = 2500
skirts = 1
skirt_distance = 2
skirt_height = 1
brim_type = outer_only
brim_width = 0
brim_separation = 0.1
support_material = 0
support_material_auto = 1
support_material_threshold = 55
support_material_contact_distance = 0.2
support_material_interface_layers = 2
support_material_spacing = 2
support_material_xy_spacing = 50%
dont_support_bridges = 1
complete_objects = 0
extruder_clearance_height = 30
extruder_clearance_radius = 45
output_filename_format = {input_filename_base}.gcode
